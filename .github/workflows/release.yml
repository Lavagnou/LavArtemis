name: Build & Release APK

# Builds the nonRoot_game release APKs (one per ABI) and publishes them as a
# GitHub release.
#
# Triggers:
#   - Pushing a tag like v1.2.3 -> full release under that tag
#   - Manual run (workflow_dispatch) -> prerelease tagged v<versionName>-ci.<run>
#
# Signing:
#   By default the APKs are signed with the runner's debug key, which is fine
#   for testing but changes on every run (you must uninstall before updating).
#   For stable signing, add these repository secrets:
#     RELEASE_KEYSTORE_BASE64   - keystore file encoded with `base64 -w0 keystore.jks`
#     RELEASE_KEYSTORE_PASSWORD - keystore password
#     RELEASE_KEY_ALIAS         - key alias
#     RELEASE_KEY_PASSWORD      - key password

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"

      - name: Decode release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          CI_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleNonRoot_gameRelease --no-daemon

      - name: Determine release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
            echo "tag=v${VERSION}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect and rename APKs
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in app/build/outputs/apk/nonRoot_game/release/*.apk; do
            abi=$(basename "$f" .apk | sed 's/^app-nonRoot_game-//; s/-release.*$//')
            cp "$f" "dist/LavArtemis-${{ steps.tag.outputs.tag }}-${abi}.apk"
          done
          ls -l dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*.apk
