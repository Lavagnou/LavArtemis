name: Build & Release

# Builds and publishes LavArtemis for every supported platform under a single
# tag, so Android and desktop always ship together:
#   - LavArtemis          (Android, nonRoot_game flavor, standard controllers)
#   - LavArtemis-TX15     (Android, RadioMaster TX15 radio)
#   - LavArtemis Windows  (x64 + ARM64 portable, plus a combined installer)
#   - LavArtemis Linux    (x86_64 AppImage, which is also how Steam Deck runs it)
#
# The desktop client lives in the `desktop/` submodule (Lavagnou/LavArtemis-Qt).
# The submodule commit recorded here is what gets built, so a release is always
# reproducible from this repository's tag alone.
#
# Triggers:
#   - Pushing a tag like v1.2.3 -> full release under that tag
#   - Manual run (workflow_dispatch) -> prerelease tagged v<versionName>-ci.<run>
#
# Signing:
#   Android is signed with the release keystore when RELEASE_KEYSTORE_BASE64 and
#   friends are set, and falls back to the runner's debug key otherwise (fine for
#   testing, but it changes every run so you must uninstall before updating).
#   Windows binaries are Authenticode-signed only when WINDOWS_CERT_BASE64 is set;
#   without it they are published unsigned rather than failing the build.
#
#   Android secrets: RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
#                    RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
#   Windows secrets: WINDOWS_CERT_BASE64, WINDOWS_CERT_PASSWORD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Determine release tag
        id: tag
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"

            # The tag is the source of truth for the desktop version string, so
            # refuse to publish if it disagrees with the Android versionName.
            if [ "$TAG" != "v${VERSION}" ]; then
              echo "Tag $TAG does not match versionName $VERSION in app/build.gradle" >&2
              echo "Bump versionName (and versionCode) before tagging." >&2
              exit 1
            fi

            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VERSION}-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # The desktop pointer is advanced by hand (Actions -> Update desktop
      # pointer), so it can silently fall behind between releases. Report the
      # gap here rather than closing it: what gets released must stay exactly
      # what the tag records, and moving the pointer mid-run would break that.
      - name: Report desktop pointer freshness
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_REPO: Lavagnou/LavArtemis-Qt
        run: |
          set -uo pipefail

          PINNED=$(git rev-parse HEAD:desktop)
          LATEST=$(gh api \
            "repos/$DESKTOP_REPO/actions/workflows/build.yml/runs?branch=main&status=success&event=push&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')

          if [ -z "$LATEST" ]; then
            echo "Could not reach $DESKTOP_REPO; skipping the freshness check."
            exit 0
          fi

          if [ "$PINNED" = "$LATEST" ]; then
            echo "### Desktop client is current" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Pinned at \`${PINNED:0:8}\`, the newest green commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BEHIND=$(gh api "repos/$DESKTOP_REPO/compare/$PINNED...$LATEST" --jq '.ahead_by // empty')

          echo "::warning::This release pins desktop ${PINNED:0:8}, but ${LATEST:0:8} is newer and green (${BEHIND:-?} commits ahead). Run 'Update desktop pointer' and re-tag if you meant to ship it."
          {
            echo "### Desktop client is behind"
            echo ""
            echo "This release pins \`${PINNED:0:8}\`, but \`${LATEST:0:8}\` has built green since"
            echo "— **${BEHIND:-an unknown number of} commits** ahead."
            echo ""
            echo "The pointer was left alone on purpose: a tag must build the same thing every time."
            echo "To ship the newer client, run **Update desktop pointer**, then re-tag."
            echo ""
            gh api "repos/$DESKTOP_REPO/compare/$PINNED...$LATEST" \
              --jq '.commits[] | "- \(.sha[0:8]) \(.commit.message | split("\n")[0])"' 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

  build-android:
    needs: version
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Only the native core is needed here. The desktop submodule is large, so
      # we deliberately don't pull it into the Android job.
      - name: Checkout native core submodule
        run: git submodule update --init --recursive app/src/main/jni/moonlight-core/moonlight-common-c

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973"

      - name: Decode release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          CI_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleNonRoot_gameRelease assembleTx15_gameRelease --no-daemon

      - name: Collect and rename APKs
        run: |
          mkdir -p dist
          shopt -s nullglob
          for flavor in nonRoot_game tx15_game; do
            case "$flavor" in
              nonRoot_game) prefix="LavArtemis" ;;
              tx15_game)    prefix="LavArtemis-TX15" ;;
            esac
            for f in app/build/outputs/apk/$flavor/release/*.apk; do
              abi=$(basename "$f" .apk | sed "s/^app-$flavor-//; s/-release.*$//")
              cp "$f" "dist/$prefix-${{ needs.version.outputs.tag }}-android-${abi}.apk"
            done
          done
          ls -l dist

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  build-windows:
    needs: version
    runs-on: windows-2025
    env:
      QT_VERSION: 6.11.1
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Build the exact desktop commit this repository pins, not whatever is on
      # LavArtemis-Qt's main branch right now.
      - name: Checkout desktop submodule
        run: git submodule update --init --recursive desktop

      - name: Stamp desktop version from tag
        shell: bash
        run: echo "${{ needs.version.outputs.version }}" > desktop/app/version.txt

      - name: Download prebuilt dependencies
        working-directory: desktop
        run: powershell ./setup-deps.ps1

      - name: Install Qt (host x64)
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          version: ${{ env.QT_VERSION }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Install Qt (arm64 cross)
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          arch: win64_msvc2022_arm64_cross_compiled
          version: ${{ env.QT_VERSION }}

      - name: Decode signing certificate
        if: env.WINDOWS_CERT_BASE64 != ''
        shell: bash
        run: |
          echo "$WINDOWS_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          echo "SIGN=1" >> "$GITHUB_ENV"
          echo "SIGNTOOL_PARAMS=sign /fd SHA256 /f $RUNNER_TEMP\\cert.pfx /p ${{ secrets.WINDOWS_CERT_PASSWORD }} /tr http://timestamp.digicert.com /td SHA256" >> "$GITHUB_ENV"

      - name: Build x64
        shell: cmd
        working-directory: desktop
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\${{ env.QT_VERSION }}\msvc2022_64\bin

      - name: Build ARM64
        shell: cmd
        working-directory: desktop
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release arm64
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\${{ env.QT_VERSION }}\msvc2022_arm64\bin

      # Produces the combined installer, so it needs both MSIs built above.
      - name: Build installer bundle
        shell: cmd
        working-directory: desktop
        run: scripts\generate-bundle.bat Release

      # v20.3.0 shipped an installer that exited silently on every machine: the
      # bootstrapper theme referenced `artemis.ico` while the rebrand had
      # renamed the payload to `lavartemis.ico`. Burn resolves theme assets by
      # name at runtime, so a missing one fails theme parsing before any window
      # exists -- nothing appears, no error, and the build stays green because
      # WiX is perfectly happy to embed a theme whose references do not resolve.
      #
      # Cracking the bundle open and checking that every asset the theme asks
      # for is actually in it takes seconds and turns that into a failed build.
      - name: Verify installer theme assets resolve
        shell: bash
        working-directory: desktop
        run: |
          set -euo pipefail

          dotnet tool install --global wix --version 7.0.0 > /dev/null
          export PATH="$PATH:$HOME/.dotnet/tools"

          BUNDLE=$(find build/installer-release -name 'LavArtemisSetup*.exe' | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "::error::No installer bundle found to verify."
            exit 1
          fi

          wix burn extract "$BUNDLE" -o /tmp/burn -oba /tmp/burn/ba -acceptEula wix7 > /dev/null

          # Two separate ways this file kills the installer without any build
          # noticing, so check both. Parse it as XML first: a stray double
          # hyphen in a comment is enough to make the whole theme unloadable,
          # and grepping for filenames happily succeeds on a file Burn cannot
          # even open. Then confirm the assets it names are really payloads,
          # which are extracted flat into the same folder.
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path

          ba = Path("/tmp/burn/ba")
          theme = ba / "thm.xml"

          try:
              root = ET.parse(theme).getroot()
          except ET.ParseError as e:
              print(f"::error::Installer theme is not valid XML ({e}). "
                    "Check wix/LavArtemisSetup/RtfTheme.xml -- note XML comments "
                    "may not contain a double hyphen.")
              sys.exit(1)

          assets = sorted({v for el in root.iter()
                             for k, v in el.attrib.items()
                             if k in ("IconFile", "ImageFile")})
          missing = False
          for name in assets:
              if (ba / name).is_file():
                  print(f"  ok       {name}")
              else:
                  print(f"::error::Installer theme references '{name}', which is "
                        "not among its payloads. Check the Payload names in "
                        "wix/LavArtemisSetup/Bundle.wxs against RtfTheme.xml.")
                  missing = True

          sys.exit(1 if missing else 0)
          PY

      - name: Collect and rename Windows artifacts
        shell: bash
        run: |
          set -e
          TAG="${{ needs.version.outputs.tag }}"
          mkdir -p dist

          for arch in x64 arm64; do
            (cd "desktop/build/deploy-${arch}-release" && \
              7z a -tzip "$GITHUB_WORKSPACE/dist/LavArtemis-${TAG}-win-${arch}.zip" ./*)
          done

          # generate-bundle.bat names this LavArtemisSetup-<version>.exe
          find desktop/build -name 'LavArtemisSetup-*.exe' -exec \
            cp {} "dist/LavArtemis-${TAG}-win-installer.exe" \;

          ls -l dist

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  # There are no usable prebuilt packages for what the Linux client needs, so
  # this job builds SDL3, libva, libplacebo, dav1d and FFmpeg from source before
  # it can even configure the app. Expect it to be by far the longest job here.
  #
  # Steam Deck is covered by the AppImage. A Flatpak would mean a Flathub
  # submission and a manifest that doesn't exist yet, so it is not built here.
  build-linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout desktop submodule
        run: git submodule update --init --recursive desktop

      - name: Stamp desktop version from tag
        run: echo "${{ needs.version.outputs.version }}" > desktop/app/version.txt

      - name: Set up environment
        run: |
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.4.313-jammy.list https://packages.lunarg.com/vulkan/1.4.313/lunarg-vulkan-1.4.313-jammy.list
          sudo apt update
          sudo apt install -y qt6-base-dev qt6-declarative-dev libqt6svg6-dev qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-layouts \
            qml6-module-qtqml-workerscript qml6-module-qtquick-window qml6-module-qtquick python3-pip nasm libgbm-dev libdrm-dev libfreetype-dev libasound2-dev \
            libdbus-1-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libglu1-mesa-dev libibus-1.0-dev libpulse-dev libudev-dev libx11-dev libxcursor-dev \
            libxext-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libxss-dev libxt-dev libxv-dev libxxf86vm-dev libxcb-dri3-dev libx11-xcb-dev \
            libxfixes-dev libxtst-dev wayland-protocols libopus-dev libvdpau-dev libgl-dev libpipewire-0.3-dev liburing-dev vulkan-sdk cmake
          sudo pip3 install meson
          mkdir -p dep_root/bin
          echo "$PWD/dep_root/bin" >> "${GITHUB_PATH}"

      # Dependencies land under desktop/deps so the relative paths baked into
      # the submodule's own patches and scripts keep resolving.
      - name: Checkout SDL3
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.14
          path: desktop/deps/SDL

      - name: Build SDL3
        working-directory: desktop/deps/SDL
        run: |
          cmake -DSDL_KMSDRM=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_INSTALL_DOCS=OFF -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -S . -B build
          cmake --build build -j
          sudo cmake --install build

      - name: Checkout sdl2-compat
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/sdl2-compat
          ref: release-2.32.70
          path: desktop/deps/sdl2-compat

      - name: Build sdl2-compat
        working-directory: desktop/deps/sdl2-compat
        run: |
          cmake -DSDL2COMPAT_TESTS=OFF -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -S . -B build
          cmake --build build -j
          sudo cmake --install build

      - name: Checkout SDL_ttf
        uses: actions/checkout@v5
        with:
          repository: libsdl-org/SDL_ttf
          ref: a883e490e30fb44a5336ea3dcb990c6982c5216f
          path: desktop/deps/SDL_ttf
          submodules: 'recursive'

      - name: Build SDL_ttf
        working-directory: desktop/deps/SDL_ttf
        run: |
          ./autogen.sh
          ./configure
          make -j$(nproc)
          sudo make install

      - name: Checkout libva
        uses: actions/checkout@v5
        with:
          repository: intel/libva
          ref: 2.24.1
          path: desktop/deps/libva

      - name: Build libva
        working-directory: desktop/deps/libva
        run: |
          ./autogen.sh
          ./configure --enable-x11
          make -j$(nproc)
          sudo make install

      - name: Checkout libplacebo
        uses: actions/checkout@v5
        with:
          repository: haasn/libplacebo
          ref: 4d82c6898551068d4ae6a6b5538efcddc2c7cf64
          path: desktop/deps/libplacebo
          submodules: 'recursive'

      - name: Build libplacebo
        working-directory: desktop/deps/libplacebo
        run: |
          git apply ../../app/deploy/linux/appimage/*.patch
          meson setup build -Dvulkan=enabled -Dopengl=disabled -Ddemos=false
          ninja -C build
          sudo ninja install -C build

      - name: Build dav1d
        working-directory: desktop/deps
        env:
          DAV1D_VER: 1.5.4
        run: |
          git clone --branch $DAV1D_VER --depth 1 https://code.videolan.org/videolan/dav1d.git
          pushd dav1d
          meson setup build -Ddefault_library=static -Dbuildtype=release -Denable_tools=false -Denable_tests=false
          ninja -C build
          sudo ninja install -C build
          popd

      - name: Checkout FFmpeg
        uses: actions/checkout@v5
        with:
          repository: FFmpeg/FFmpeg
          ref: n9.0
          path: desktop/deps/FFmpeg

      - name: Build FFmpeg
        working-directory: desktop/deps/FFmpeg
        run: |
          ./configure --enable-pic --enable-lto --disable-static --enable-shared --disable-all --disable-autodetect \
            --enable-avcodec --enable-avformat --enable-swscale \
            --enable-decoder=h264 --enable-decoder=hevc --enable-decoder=av1 \
            --enable-vaapi --enable-hwaccel=h264_vaapi --enable-hwaccel=hevc_vaapi --enable-hwaccel=av1_vaapi \
            --enable-vdpau --enable-hwaccel=h264_vdpau  --enable-hwaccel=hevc_vdpau --enable-hwaccel=av1_vdpau \
            --enable-libdrm --enable-vulkan --enable-hwaccel=h264_vulkan --enable-hwaccel=hevc_vulkan --enable-hwaccel=av1_vulkan \
            --enable-libdav1d --enable-decoder=libdav1d
          make -j$(nproc)
          sudo make install

      - name: Install linuxdeploy
        working-directory: dep_root/bin
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Build AppImage
        working-directory: desktop
        run: |
          sudo ldconfig
          scripts/build-appimage.sh

      - name: Collect and rename AppImage
        run: |
          set -e
          mkdir -p dist
          # linuxdeploy derives the name from the .desktop entry and version.txt,
          # so match on the extension rather than guessing the exact string.
          find desktop/build/installer-release -name '*.AppImage' -exec \
            cp {} "dist/LavArtemis-${{ needs.version.outputs.tag }}-linux-x86_64.AppImage" \;
          ls -l dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    needs: [version, build-android, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -l dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: dist/*
